# busybox gives exec a shell, logs a known first line, and port-forward a
# listener -- the three things the compatibility tests need from a pod.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
        command: [sh, -c, 'mkdir -p /www && echo blastgate-ok > /www/index.html && echo started && exec httpd -f -p 8080 -h /www']
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
